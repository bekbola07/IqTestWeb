<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Question</title>
    <div th:replace="~{fragments :: common-styles}"></div>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Additional page-specific styles */
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        .hidden-file-input {
            display: none;
        }

        /* Options Grid */
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .lightbox-close:hover {
            color: #bbb;
        }

        /* Make preview clickable */
        .file-preview-thumb {
            cursor: zoom-in;
            transition: transform 0.2s;
        }
        .file-preview-thumb:hover {
            transform: scale(1.05);
        }

        /* Alpine Transitions */
        [x-cloak] { display: none !important; }

        @media (max-width: 768px) {
            .grid-2-col, #options-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar(backLink=@{/quiz/{id}/edit(id=${quiz.id})})}"></div>

<div class="container" x-data="editQuestionForm()">
    <form th:action="@{/quiz/{quizId}/questions/{questionId}/edit(quizId=${quiz.id}, questionId=${question.questionId})}" th:object="${question}" method="post" enctype="multipart/form-data" autocomplete="off" @submit.prevent="submitForm($event)">
        <div class="card">
            <h1 th:text="|Edit Question for: ${quiz.name}|">Edit Question</h1>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="questionType">Question Type</label>
                    <select id="questionType" th:field="*{questionType}" x-model="questionType" class="form-control" @change="handleTypeChange()">
                        <option value="MULTIPLE_CHOICE_SINGLE">Multiple Choice (Single Answer)</option>
                        <option value="MULTIPLE_CHOICE_MULTI">Multiple Choice (Multiple Answers)</option>
                        <option value="TRUE_FALSE">True / False</option>
                        <option value="FILL_IN_THE_BLANK">Fill in the Blank</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" th:field="*{questionCategory.categoryId}" required>
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="questionText">Question Text</label>
                <textarea id="questionText" th:field="*{questionText}" rows="3" placeholder="Enter your question here..." required></textarea>
            </div>

            <div class="form-group" x-show="questionType !== 'FILL_IN_THE_BLANK'">
                <label>Question Image (Optional)</label>
                <div class="file-upload-wrapper" id="q-image-uploader">
                    <!-- Existing Image Preview -->
                    <div class="file-preview-card" id="q-existing-card" th:if="${question.attachment != null}" style="display: flex;">
                        <img class="file-preview-thumb" th:src="${question.attachment.webUrl != null ? question.attachment.webUrl : '/attachment/' + question.attachment.id}" title="Click to enlarge" onclick="openLightbox(this.src)">
                        <div class="file-info">
                            <span class="file-name">Existing Image</span>
                        </div>
                        <div class="file-actions">
                            <button type="button" class="btn-remove-file" onclick="removeExistingQuestionImage()" title="Remove file"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <input type="hidden" name="removeQuestionImage" id="removeQuestionImage" value="false">

                    <!-- New Image Uploader -->
                    <div class="file-upload-area" id="q-upload-area" th:style="${question.attachment != null ? 'display: none;' : ''}" onclick="document.getElementById('questionImage').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to Attach Image</span>
                    </div>
                    <input type="file" name="questionImage" id="questionImage" accept="image/*" class="hidden-file-input" onchange="previewFile(this, 'q-preview', 'q-upload-area')">
                    <div id="q-preview" style="display:none; margin-top: 10px;">
                        <img src="" style="max-height: 150px; border-radius: 8px;">
                        <button type="button" class="btn btn-sm btn-danger" onclick="clearFile('questionImage', 'q-preview', 'q-upload-area')">Remove New Image</button>
                    </div>
                </div>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="points">Points</label>
                    <input type="number" id="points" th:field="*{points}" min="1" required placeholder="e.g., 10">
                </div>
                <div class="form-group" th:if="${quiz.timeType.name() == 'PER_QUESTION'}">
                    <label for="timeLimitSeconds">Time Limit (seconds)</label>
                    <input type="number" id="timeLimitSeconds" th:field="*{timeLimitSeconds}" min="10" required placeholder="e.g., 60">
                </div>
            </div>
        </div>

        <!-- Answer Options Section -->
        <div class="card" x-show="questionType !== 'FILL_IN_THE_BLANK'">
            <h2 x-text="getOptionsTitle()">Answer Options</h2>
            <p class="text-secondary" style="margin-top: -1rem; margin-bottom: 1rem;" x-text="getOptionsSubtitle()"></p>

            <!-- Dynamic Options Container -->
            <div id="options-container" :class="{'grid-2-col': questionType !== 'TRUE_FALSE'}">

                <!-- Template for Multiple Choice (Single & Multi) -->
                <template x-for="(option, index) in options" :key="option.id">
                    <div class="answer-option-card" x-show="questionType === 'MULTIPLE_CHOICE_SINGLE' || questionType === 'MULTIPLE_CHOICE_MULTI'">
                        <div class="radio-wrapper">
                            <!-- Single Choice Radio -->
                            <input x-show="questionType === 'MULTIPLE_CHOICE_SINGLE'"
                                   type="radio"
                                   name="correctOptionIndex"
                                   :value="index"
                                   :checked="option.isCorrect"
                                   required>

                            <!-- Multi Choice Checkbox -->
                            <input x-show="questionType === 'MULTIPLE_CHOICE_MULTI'"
                                   type="checkbox"
                                   name="correctOptionIndices"
                                   :value="index"
                                   :checked="option.isCorrect">
                        </div>
                        <div class="option-content">
                            <input type="text" name="optionTexts" x-model="option.text" placeholder="Answer text" required>

                            <!-- Existing Option Image -->
                            <div x-show="option.imageUrl" class="file-preview-card" style="display: flex; margin-top: 5px;">
                                <img class="file-preview-thumb" :src="option.imageUrl" style="max-height: 50px;" @click="openLightbox(option.imageUrl)">
                                <div class="file-actions">
                                    <button type="button" class="btn-remove-file" @click="removeOptionImage(index)" title="Remove file"><i class="fas fa-trash"></i></button>
                                </div>
                                <input type="hidden" name="removeOptionImages" :value="option.removeImage">
                            </div>

                            <!-- Option Image Uploader -->
                            <div class="file-upload-wrapper" style="margin-top: 5px;" x-show="!option.imageUrl || option.removeImage">
                                <input type="file" name="optionImages" class="form-control-file" accept="image/*">
                            </div>
                        </div>
                        <div class="option-actions">
                            <button type="button" class="btn btn-danger btn-icon btn-sm" @click="removeOption(index)" x-show="options.length > 2">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- True/False Static Options -->
                <div class="answer-option-card" x-show="questionType === 'TRUE_FALSE'">
                    <div class="radio-wrapper">
                        <input type="radio" name="correctOptionIndex" value="0" :checked="isTrueCorrect">
                    </div>
                    <div class="option-content">
                        <input type="text" name="optionTexts" value="True" readonly style="background-color: #f8f9fa; cursor: not-allowed;">
                    </div>
                </div>
                <div class="answer-option-card" x-show="questionType === 'TRUE_FALSE'">
                    <div class="radio-wrapper">
                        <input type="radio" name="correctOptionIndex" value="1" :checked="!isTrueCorrect">
                    </div>
                    <div class="option-content">
                        <input type="text" name="optionTexts" value="False" readonly style="background-color: #f8f9fa; cursor: not-allowed;">
                    </div>
                </div>

            </div>

            <button type="button" class="btn btn-secondary" style="margin-top: var(--spacing-md); width: 100%;"
                    @click="addOption()"
                    x-show="questionType === 'MULTIPLE_CHOICE_SINGLE' || questionType === 'MULTIPLE_CHOICE_MULTI'">
                <i class="fas fa-plus"></i> Add Answer Option
            </button>
        </div>

        <!-- Fill in the Blank Section -->
        <div class="card" x-show="questionType === 'FILL_IN_THE_BLANK'">
            <h2>Correct Answer</h2>
            <p class="text-secondary">Enter the exact text the user must type to answer correctly.</p>
            <div class="form-group">
                <label>Correct Answer Text</label>
                <input type="text" name="optionTexts" placeholder="e.g., Paris" :required="questionType === 'FILL_IN_THE_BLANK'" x-model="fillBlankAnswer">
                <input type="hidden" name="correctOptionIndex" value="0">
            </div>
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> The answer will be checked case-insensitively (e.g., "Paris" and "paris" are both correct).
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
            <a th:href="@{/quiz/{id}/edit(id=${quiz.id})}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </div>
    </form>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="">
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const initialOptions = /*[[${answerOptions}]]*/ [];
    const initialType = /*[[${question.questionType}]]*/ 'MULTIPLE_CHOICE_SINGLE';
    /*]]>*/

    function editQuestionForm() {
        return {
            questionType: initialType,
            options: [],
            isTrueCorrect: true,
            fillBlankAnswer: '',

            init() {
                // Initialize options from backend data
                if (this.questionType === 'FILL_IN_THE_BLANK') {
                    if (initialOptions.length > 0) {
                        this.fillBlankAnswer = initialOptions[0].optionText;
                    }
                } else if (this.questionType === 'TRUE_FALSE') {
                    // Find which one is correct (True is index 0, False is index 1 usually)
                    // Assuming True is first option
                    if (initialOptions.length > 0) {
                        this.isTrueCorrect = initialOptions[0].isCorrect;
                    }
                } else {
                    // Multiple Choice
                    this.options = initialOptions.map((opt, index) => ({
                        id: index,
                        text: opt.optionText,
                        isCorrect: opt.isCorrect,
                        imageUrl: opt.attachment ? (opt.attachment.webUrl || '/attachment/' + opt.attachment.id) : null,
                        removeImage: false
                    }));

                    // Ensure at least 2 options
                    while (this.options.length < 2) {
                        this.addOption();
                    }
                }
            },

            handleTypeChange() {
                if (this.questionType === 'MULTIPLE_CHOICE_SINGLE' || this.questionType === 'MULTIPLE_CHOICE_MULTI') {
                    if (this.options.length < 2) {
                        this.options = [{ id: Date.now(), text: '', isCorrect: false }, { id: Date.now() + 1, text: '', isCorrect: false }];
                    }
                }
            },

            addOption() {
                this.options.push({ id: Date.now(), text: '', isCorrect: false, imageUrl: null, removeImage: false });
            },

            removeOption(index) {
                if (this.options.length > 2) {
                    this.options.splice(index, 1);
                }
            },

            removeOptionImage(index) {
                this.options[index].removeImage = true;
                // We don't remove the imageUrl immediately to allow undo if we implemented it,
                // but for now we just hide it via x-show logic in template
                this.options[index].imageUrl = null;
            },

            getOptionsTitle() {
                if (this.questionType === 'TRUE_FALSE') return 'Select Correct Option';
                return 'Answer Options';
            },

            getOptionsSubtitle() {
                if (this.questionType === 'MULTIPLE_CHOICE_MULTI') return 'Select all correct answers (Checkboxes).';
                if (this.questionType === 'TRUE_FALSE') return 'Select whether the statement is True or False.';
                return 'Select the single correct answer (Radio button).';
            },

            submitForm(event) {
                if (this.questionType === 'MULTIPLE_CHOICE_MULTI') {
                    const checkboxes = document.querySelectorAll('input[name="correctOptionIndices"]:checked');
                    if (checkboxes.length === 0) {
                        alert('Please select at least one correct answer.');
                        return;
                    }
                }
                event.target.submit();
            },

            openLightbox(src) {
                document.getElementById('lightbox-img').src = src;
                document.getElementById('lightbox').style.display = 'flex';
            }
        }
    }

    // Vanilla JS helpers
    function previewFile(input, previewId, areaId) {
        const file = input.files[0];
        const previewDiv = document.getElementById(previewId);
        const areaDiv = document.getElementById(areaId);
        const img = previewDiv.querySelector('img');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                previewDiv.style.display = 'block';
                if(areaDiv) areaDiv.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    function clearFile(inputId, previewId, areaId) {
        document.getElementById(inputId).value = '';
        document.getElementById(previewId).style.display = 'none';
        const areaDiv = document.getElementById(areaId);
        if(areaDiv) areaDiv.style.display = 'flex';
    }

    function removeExistingQuestionImage() {
        if(confirm('Remove existing image?')) {
            document.getElementById('removeQuestionImage').value = 'true';
            document.getElementById('q-existing-card').style.display = 'none';
            document.getElementById('q-upload-area').style.display = 'flex';
        }
    }

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
</script>

</body>
</html>
