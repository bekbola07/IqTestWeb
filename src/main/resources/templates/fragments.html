<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Common Head Content Fragment -->
    <div th:fragment="head">
        <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
        <link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                /* Colors */
                --primary-color: #3498DB;
                --primary-dark: #2980B9;
                --secondary-color: #95A5A6;
                --success-color: #2ECC71;
                --danger-color: #E74C3C;
                --warning-color: #F1C40F;
                --text-main: #2C3E50;
                --text-secondary: #7F8C8D;
                --bg-body: #F5F7FA;
                --bg-card: #FFFFFF;
                --border-color: #E5E7EB;
                --input-bg: #F9FAFB;

                /* Spacing */
                --spacing-xs: 4px;
                --spacing-sm: 8px;
                --spacing-md: 16px;
                --spacing-lg: 24px;
                --spacing-xl: 32px;

                /* Border Radius */
                --radius-sm: 6px;
                --radius-md: 8px;
                --radius-lg: 12px;

                /* Shadows */
                --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }

            * {
                box-sizing: border-box;
            }

            body {
                background-color: var(--bg-body);
                color: var(--text-main);
                font-family: 'Inter', sans-serif;
                margin: 0;
                padding: 0;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }

            h1, h2, h3, h4, h5, h6 {
                margin-top: 0;
                font-weight: 600;
                color: var(--text-main);
            }

            h1 { font-size: 1.875rem; margin-bottom: var(--spacing-lg); }
            h2 { font-size: 1.5rem; margin-bottom: var(--spacing-md); }

            /* Layout */
            .container {
                max-width: 1100px;
                margin: 0 auto;
                padding: var(--spacing-xl) var(--spacing-md);
            }

            .card {
                background: var(--bg-card);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                padding: var(--spacing-xl);
                margin-bottom: var(--spacing-lg);
                border: 1px solid var(--border-color);
            }

            /* Navbar */
            .navbar {
                background: var(--bg-card);
                padding: var(--spacing-sm) var(--spacing-xl);
                box-shadow: var(--shadow-sm);
                border-bottom: 1px solid var(--border-color);
                position: sticky;
                top: 0;
                z-index: 100;
            }
            .navbar-content {
                max-width: 1400px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .navbar h1 {
                font-size: 1.15rem;
                margin: 0;
                color: var(--primary-color);
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .navbar h1 img {
                height: 24px;
                width: auto;
            }
            .user-section {
                display: flex;
                align-items: center;
                gap: var(--spacing-md);
            }
            .user-info {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                font-size: 0.9rem;
            }
            .user-avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid var(--border-color);
            }
            .admin-badge {
                background: var(--text-main);
                color: white;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            /* Buttons */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--spacing-sm);
                padding: 0.625rem 1.25rem;
                border-radius: var(--radius-md);
                font-weight: 500;
                font-size: 0.95rem;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.2s ease;
                border: 1px solid transparent;
                line-height: 1;
            }
            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            .btn-sm {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
            .btn-primary {
                background-color: var(--primary-color);
                color: white;
            }
            .btn-primary:hover:not(:disabled) {
                background-color: var(--primary-dark);
                transform: translateY(-1px);
                box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
            }
            .btn-secondary {
                background-color: white;
                border-color: var(--border-color);
                color: var(--text-main);
            }
            .btn-secondary:hover:not(:disabled) {
                background-color: #F8F9FA;
                border-color: #D1D5DB;
            }
            .btn-danger {
                background-color: #FEF2F2;
                color: var(--danger-color);
                border-color: #FECACA;
            }
            .btn-danger:hover:not(:disabled) {
                background-color: var(--danger-color);
                color: white;
                border-color: var(--danger-color);
            }
            .btn-icon {
                padding: 0.5rem;
                border-radius: 50%;
                width: 32px;
                height: 32px;
            }

            /* Forms */
            .form-group {
                margin-bottom: var(--spacing-lg);
            }
            label {
                display: block;
                font-weight: 500;
                margin-bottom: var(--spacing-sm);
                color: var(--text-main);
                font-size: 0.95rem;
            }
            input[type="text"],
            input[type="number"],
            input[type="email"],
            input[type="password"],
            textarea,
            select {
                width: 100%;
                padding: 0.75rem 1rem;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                font-size: 1rem;
                background-color: var(--input-bg);
                transition: border-color 0.2s, box-shadow 0.2s;
                color: var(--text-main);
            }
            input:focus, textarea:focus, select:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
                background-color: white;
            }
            ::placeholder {
                color: #9CA3AF;
            }

            /* Custom File Upload Component */
            .file-upload-wrapper {
                position: relative;
                width: 100%;
            }
            .file-upload-area {
                border: 2px dashed var(--border-color);
                border-radius: var(--radius-md);
                padding: var(--spacing-md);
                text-align: center;
                cursor: pointer;
                transition: all 0.2s;
                background: var(--input-bg);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100px;
            }
            .file-upload-area:hover {
                border-color: var(--primary-color);
                background: #F0F9FF;
            }
            .file-upload-area i {
                font-size: 1.5rem;
                color: var(--text-secondary);
                margin-bottom: var(--spacing-sm);
            }
            .file-upload-area span {
                font-size: 0.9rem;
                color: var(--text-secondary);
            }
            .file-preview-card {
                display: flex;
                align-items: center;
                gap: var(--spacing-md);
                padding: var(--spacing-sm);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                background: white;
                margin-top: var(--spacing-sm);
            }
            .file-preview-thumb {
                width: 48px;
                height: 48px;
                border-radius: var(--radius-sm);
                object-fit: cover;
                background: #eee;
            }
            .file-info {
                flex: 1;
                overflow: hidden;
            }
            .file-name {
                font-size: 0.9rem;
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .file-actions {
                display: flex;
                gap: var(--spacing-sm);
            }
            .btn-remove-file {
                color: var(--danger-color);
                background: none;
                border: none;
                cursor: pointer;
                padding: 4px;
                font-size: 1.1rem;
                transition: transform 0.2s;
            }
            .btn-remove-file:hover {
                transform: scale(1.1);
            }

            /* Answer Option Card */
            .answer-option-card {
                background: white;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                padding: var(--spacing-md);
                margin-bottom: var(--spacing-md);
                display: flex;
                align-items: flex-start;
                gap: var(--spacing-md);
                transition: box-shadow 0.2s;
            }
            .answer-option-card:hover {
                box-shadow: var(--shadow-md);
                border-color: #D1D5DB;
            }
            .radio-wrapper {
                padding-top: 10px;
            }
            .option-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: var(--spacing-sm);
            }
            .option-actions {
                padding-top: 4px;
            }

            /* Footer Styles */
            .footer {
                padding: var(--spacing-xl) 0;
                text-align: center;
                color: var(--text-secondary);
                font-size: 0.9rem;
                border-top: 1px solid var(--border-color);
                background: white;
                margin-top: auto;
            }

            /* Language Switcher Styles */
            .language-switcher {
                display: flex;
                gap: 8px;
                align-items: center;
                margin-left: auto;
                margin-right: 20px;
            }

            .language-switcher a {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 14px;
                border-radius: 10px;
                border: 1.5px solid rgba(0,0,0,0.12);
                background: #fff;
                text-decoration: none;
                font-size: 14px;
                color: #666;
                transition: all 0.2s ease;
                position: relative;
                overflow: hidden;
            }

            .language-switcher a:hover {
                border-color: rgba(0,0,0,0.25);
                color: #333;
                transform: translateY(-1px);
                background: #f8f8f8;
            }

            .language-switcher a:active {
                transform: translateY(0) scale(0.97);
            }

            .language-switcher a.active {
                border-color: #1D9E75;
                background: #E1F5EE;
                color: #0F6E56;
                font-weight: 500;
            }

            .language-switcher a.active .lang-dot {
                background: #1D9E75;
            }

            .language-switcher img {
                width: 22px;
                height: 15px;
                border-radius: 3px;
                object-fit: cover;
                display: block;
            }

            .lang-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: transparent;
                transition: background 0.2s;
            }

            /* Responsive */
            @media (max-width: 768px) {
                .container { padding: var(--spacing-md); }
                .navbar-content { flex-direction: column; gap: var(--spacing-md); }
                .answer-option-card { flex-direction: column; }
                .radio-wrapper { align-self: flex-start; }
            }
        </style>
    </div>

    <!-- For backward compatibility -->
    <div th:fragment="common-styles">
        <div th:replace="~{fragments :: head}"></div>
    </div>
</head>
<body>

<!-- Universal Navbar Fragment -->
<div th:fragment="navbar(backLink)">
    <nav class="navbar">
        <div class="navbar-content">
            <div style="display: flex; align-items: center;">
                <a th:if="${backLink != null}" th:href="@{${backLink}}" class="btn btn-secondary" style="padding: 0.5rem 1rem; margin-right: 1rem; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> [[#{header.back}]]
                </a>
                <a th:href="@{/dashboard}" style="text-decoration: none; color: inherit;">
                    <h1>
                        <img th:src="@{/images/icon.png}" alt="Logo">
                        IQ baholash platformasi
                    </h1>
                </a>
            </div>
            <div class="language-switcher">
                <a th:href="@{${request.requestURI}(lang='uz')}"
                   th:classappend="${#locale.language == 'uz' ? 'active' : ''}">
                    <img th:src="@{/images/flags/uz.png}" alt="UZ" />
<!--                    <span>O'zbek</span>-->
                    <span class="lang-dot"></span>
                </a>
                <a th:href="@{${request.requestURI}(lang='ru')}"
                   th:classappend="${#locale.language == 'ru' ? 'active' : ''}">
                    <img th:src="@{/images/flags/ru.png}" alt="RU" />
<!--                    <span>Русский</span>-->
                    <span class="lang-dot"></span>
                </a>
                <a th:href="@{${request.requestURI}(lang='en')}"
                   th:classappend="${#locale.language == 'en' ? 'active' : ''}">
                    <img th:src="@{/images/flags/en.png}" alt="EN" />
<!--                    <span>English</span>-->
                    <span class="lang-dot"></span>
                </a>
            </div>
            <div class="user-section">
                <div class="user-info">
                    <img th:src="${session.profilePicture}" alt="Profil" class="user-avatar" th:if="${session.profilePicture}">
                    <span style="font-weight: 500;" th:text="${session.userName}">Foydalanuvchi</span>
                    <span th:if="${session.userRole == 'ADMIN'}" class="admin-badge">ADMIN</span>
                </div>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-secondary btn-sm">Chiqish</button>
                </form>
            </div>
        </div>
    </nav>
</div>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <p>&copy; 2023 IQ baholash platformasi. Barcha huquqlar himoyalangan.</p>
    </div>
</footer>

</body>
</html>
