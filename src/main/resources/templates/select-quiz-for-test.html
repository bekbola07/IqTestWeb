<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Baholashni tanlash</title>
    <div th:replace="~{fragments :: common-styles}"></div>
    <style>
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }
        .quiz-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid var(--border-color);
        }
        .quiz-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .quiz-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .quiz-content {
            padding: var(--spacing-lg);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .quiz-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: var(--spacing-sm);
        }
        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
        }
        .badge {
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-type {
            background-color: var(--bg-body);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .badge-time {
            background-color: #e0f2f7; /* Light blue */
            color: #0288d1; /* Darker blue */
        }
        .quiz-actions {
            margin-top: auto; /* Pushes button to the bottom */
        }
        .btn-start {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar(backLink='/dashboard')}"></div>

<div class="container">
    <h1>Baholashni tanlang</h1>
    <p style="margin-bottom: var(--spacing-xl); color: var(--text-secondary);">O'z mahoratingizni sinab ko'rish va IQ darajangizni o'lchash uchun quyidagi baholashlardan birini tanlang.</p>

    <div th:if="${#lists.isEmpty(quizzes)}" class="card empty-state">
        <div class="empty-state-icon"><i class="fas fa-box-open"></i></div>
        <h3>Mavjud baholashlar yo'q</h3>
        <p>Ayni damda hech qanday IQ baholashlari mavjud emas. Iltimos, keyinroq qayta tekshiring!</p>
    </div>

    <div class="quiz-grid" th:if="${!#lists.isEmpty(quizzes)}">
        <!-- Loop through quizzes -->
        <div th:each="quiz : ${quizzes}" class="quiz-card">
            <img th:src="${quiz.attachment != null ? (quiz.attachment.webUrl != null ? quiz.attachment.webUrl : '/attachment/' + quiz.attachment.id) : '/images/default-quiz.jpg'}"
                 alt="Test tasviri" class="quiz-image"
                 onerror="this.onerror=null; this.src='/images/default-quiz.jpg';">

            <div class="quiz-content">
                <h3 class="quiz-title" th:text="${quiz.name}">Test nomi</h3>
                <div class="quiz-meta">
                    <span class="badge badge-type" th:text="${quiz.quizType.name}">Test turi</span>
                    <span class="badge badge-time" th:if="${quiz.timeType.name() == 'TOTAL_TIME'}">
                        <i class="fas fa-clock"></i>
                        <span th:text="${(quiz.timeLimitSeconds / 60) + ' daqiqa'}">10 daqiqa</span>
                    </span>
                </div>
                <div class="quiz-actions">
                    <a th:href="@{/test/start/{quizId}(quizId=${quiz.id})}" class="btn btn-primary btn-start">
                        Baholashni boshlash
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
