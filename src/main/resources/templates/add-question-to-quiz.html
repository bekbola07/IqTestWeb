<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{add_question.title}"></title>
    <div th:replace="~{fragments :: common-styles}"></div>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Additional page-specific styles */
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        .hidden-file-input {
            display: none;
        }

        /* Options Grid */
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .lightbox-close:hover {
            color: #bbb;
        }

        /* Make preview clickable */
        .file-preview-thumb {
            cursor: zoom-in;
            transition: transform 0.2s;
        }
        .file-preview-thumb:hover {
            transform: scale(1.05);
        }

        /* Alpine Transitions */
        [x-cloak] { display: none !important; }

        @media (max-width: 768px) {
            .grid-2-col, #options-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar(backLink=@{/quiz/{id}/edit(id=${quiz.id})})}"></div>

<div class="container" x-data="questionForm()">
    <form th:action="@{/quiz/{quizId}/questions/add(quizId=${quiz.id})}" th:object="${question}" method="post" enctype="multipart/form-data" autocomplete="off" @submit.prevent="submitForm($event)">
        <div class="card">
            <h1 th:text="|#{add_question.header} ${quiz.name}|"></h1>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="questionType" th:text="#{add_question.question_type.label}"></label>
                    <select id="questionType" th:field="*{questionType}" x-model="questionType" class="form-control" @change="handleTypeChange()">
                        <option value="MULTIPLE_CHOICE_SINGLE" th:text="#{add_question.question_type.multiple_single}"></option>
                        <option value="MULTIPLE_CHOICE_MULTI" th:text="#{add_question.question_type.multiple_multi}"></option>
                        <option value="TRUE_FALSE" th:text="#{add_question.question_type.true_false}"></option>
                        <option value="FILL_IN_THE_BLANK" th:text="#{add_question.question_type.fill_blank}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category" th:text="#{add_question.category.label}"></label>
                    <select id="category" th:field="*{questionCategory.categoryId}" required>
                        <option value="" th:text="#{add_question.category.placeholder}"></option>
                        <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="questionText" th:text="#{add_question.question_text.label}"></label>
                <textarea id="questionText" th:field="*{questionText}" rows="3" th:placeholder="#{add_question.question_text.placeholder}" required></textarea>
            </div>

            <div class="form-group" x-show="questionType !== 'FILL_IN_THE_BLANK'">
                <label th:text="#{add_question.question_image.label}"></label>
                <div class="file-upload-wrapper" id="q-image-uploader" x-init="initUploader($el, 'questionImage')">
                    <!-- Uploader will be injected here -->
                </div>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="points" th:text="#{add_question.points.label}"></label>
                    <input type="number" id="points" th:field="*{points}" min="1" required th:placeholder="#{add_question.points.placeholder}">
                </div>
            </div>
        </div>

        <!-- Answer Options Section -->
        <div class="card" x-show="questionType !== 'FILL_IN_THE_BLANK'">
            <h2 x-text="getOptionsTitle()"></h2>
            <p class="text-secondary" style="margin-top: -1rem; margin-bottom: 1rem;" x-text="getOptionsSubtitle()"></p>

            <!-- Dynamic Options Container -->
            <div id="options-container" :class="{'grid-2-col': questionType !== 'TRUE_FALSE'}">

                <!-- Template for Multiple Choice (Single & Multi) -->
                <template x-for="(option, index) in options" :key="option.id">
                    <div class="answer-option-card" x-show="questionType === 'MULTIPLE_CHOICE_SINGLE' || questionType === 'MULTIPLE_CHOICE_MULTI'">
                        <div class="radio-wrapper">
                            <!-- Single Choice Radio -->
                            <input x-show="questionType === 'MULTIPLE_CHOICE_SINGLE'"
                                   type="radio"
                                   name="correctOptionIndex"
                                   :value="index"
                                   :checked="index === 0"
                                   :disabled="questionType !== 'MULTIPLE_CHOICE_SINGLE'"
                                   required>

                            <!-- Multi Choice Checkbox -->
                            <input x-show="questionType === 'MULTIPLE_CHOICE_MULTI'"
                                   type="checkbox"
                                   name="correctOptionIndices"
                                   :value="index"
                                   :disabled="questionType !== 'MULTIPLE_CHOICE_MULTI'">
                        </div>
                        <div class="option-content">
                            <input type="text" name="optionTexts" x-model="option.text" th:placeholder="#{add_question.option.placeholder}"
                                   :disabled="questionType !== 'MULTIPLE_CHOICE_SINGLE' && questionType !== 'MULTIPLE_CHOICE_MULTI'"
                                   required>

                            <!-- Option Image Uploader -->
                            <div class="file-upload-wrapper" style="margin-top: 5px;" x-init="initUploader($el, 'optionImages', index)">
                                <!-- Uploader injected here -->
                            </div>
                        </div>
                        <div class="option-actions">
                            <button type="button" class="btn btn-danger btn-icon btn-sm" @click="removeOption(index)" x-show="options.length > 2">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- True/False Static Options -->
                <div class="answer-option-card" x-show="questionType === 'TRUE_FALSE'">
                    <div class="radio-wrapper">
                        <input type="radio" name="correctOptionIndex" value="0" checked :disabled="questionType !== 'TRUE_FALSE'">
                    </div>
                    <div class="option-content">
                        <input type="text" name="optionTexts" th:value="#{add_question.true}" readonly style="background-color: #f8f9fa; cursor: not-allowed;" :disabled="questionType !== 'TRUE_FALSE'">
                    </div>
                </div>
                <div class="answer-option-card" x-show="questionType === 'TRUE_FALSE'">
                    <div class="radio-wrapper">
                        <input type="radio" name="correctOptionIndex" value="1" :disabled="questionType !== 'TRUE_FALSE'">
                    </div>
                    <div class="option-content">
                        <input type="text" name="optionTexts" th:value="#{add_question.false}" readonly style="background-color: #f8f9fa; cursor: not-allowed;" :disabled="questionType !== 'TRUE_FALSE'">
                    </div>
                </div>

            </div>

            <button type="button" class="btn btn-secondary" style="margin-top: var(--spacing-md); width: 100%;"
                    @click="addOption()"
                    x-show="questionType === 'MULTIPLE_CHOICE_SINGLE' || questionType === 'MULTIPLE_CHOICE_MULTI'">
                <i class="fas fa-plus"></i> <span th:text="#{add_question.option.add}"></span>
            </button>
        </div>

        <!-- Fill in the Blank Section -->
        <div class="card" x-show="questionType === 'FILL_IN_THE_BLANK'">
            <h2 th:text="#{add_question.fill_blank.title}"></h2>
            <p class="text-secondary" th:text="#{add_question.fill_blank.description}"></p>

            <div id="fill-options-container" style="display: grid; gap: var(--spacing-md);">
                <template x-for="(option, index) in fillBlankOptions" :key="option.id">
                    <div class="answer-option-card">
                        <div class="option-content">
                            <input type="text" name="optionTexts" x-model="option.text" th:placeholder="#{add_question.fill_blank.placeholder}"
                                   :disabled="questionType !== 'FILL_IN_THE_BLANK'"
                                   required>
                        </div>
                        <div class="option-actions">
                            <button type="button" class="btn btn-danger btn-icon btn-sm" @click="removeFillOption(index)" x-show="fillBlankOptions.length > 1">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <button type="button" class="btn btn-secondary" style="margin-top: var(--spacing-md); width: 100%;"
                    @click="addFillOption()">
                <i class="fas fa-plus"></i> <span th:text="#{add_question.fill_blank.add}"></span>
            </button>

            <div class="alert alert-info" style="margin-top: 1rem;">
                <i class="fas fa-info-circle"></i> <span th:text="#{add_question.fill_blank.info}"></span>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
            <a th:href="@{/quiz/{id}/edit(id=${quiz.id})}" class="btn btn-secondary" th:text="#{common.cancel}"></a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> <span th:text="#{add_question.save_button}"></span>
            </button>
        </div>
    </form>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="">
</div>

<script th:inline="javascript">
    function questionForm() {
        return {
            questionType: 'MULTIPLE_CHOICE_SINGLE',
            options: [
                { id: 1, text: '' },
                { id: 2, text: '' },
                { id: 3, text: '' },
                { id: 4, text: '' }
            ],
            fillBlankOptions: [
                { id: 100, text: '' }
            ],

            handleTypeChange() {
                if (this.questionType === 'TRUE_FALSE') {
                    // True/False handled by static HTML
                } else if (this.questionType === 'FILL_IN_THE_BLANK') {
                    // Handled by separate section
                } else {
                    if (this.options.length < 2) {
                        this.options = [{ id: Date.now(), text: '' }, { id: Date.now() + 1, text: '' }];
                    }
                }
            },

            addOption() {
                this.options.push({ id: Date.now(), text: '' });
            },

            removeOption(index) {
                if (this.options.length > 2) {
                    this.options.splice(index, 1);
                }
            },

            addFillOption() {
                this.fillBlankOptions.push({ id: Date.now(), text: '' });
            },

            removeFillOption(index) {
                if (this.fillBlankOptions.length > 1) {
                    this.fillBlankOptions.splice(index, 1);
                }
            },

            getOptionsTitle() {
                if (this.questionType === 'TRUE_FALSE') return [[#{add_question.options.title}]]; // Reusing general title
                return [[#{add_question.options.title}]];
            },

            getOptionsSubtitle() {
                if (this.questionType === 'MULTIPLE_CHOICE_MULTI') return [[#{add_question.options.subtitle.multi}]];
                if (this.questionType === 'TRUE_FALSE') return [[#{add_question.options.subtitle.true_false}]];
                return [[#{add_question.options.subtitle.single}]];
            },

            submitForm(event) {
                if (this.questionType === 'MULTIPLE_CHOICE_MULTI') {
                    const checkboxes = document.querySelectorAll('input[name="correctOptionIndices"]:checked');
                    if (checkboxes.length === 0) {
                        alert([[#{add_question.alert.select_correct_answer}]]);
                        return;
                    }
                }
                event.target.submit();
            },

            initUploader(wrapper, inputName, optionIndex = null) {
                const uploaderId = 'file-' + Math.random().toString(36).substr(2, 9);
                const textInput = optionIndex !== null ? wrapper.previousElementSibling : null;

                wrapper.innerHTML = `
                    <div class="file-upload-area" id="area-${uploaderId}">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>${[[#{add_question.image_upload.attach}]]}</span>
                    </div>
                    <div class="file-preview-card" id="card-${uploaderId}" style="display: none;">
                        <img class="file-preview-thumb" id="preview-${uploaderId}" src="" title="${[[#{add_question.image_upload.preview_title}]]}">
                        <div class="file-info">
                            <span class="file-name" id="name-${uploaderId}"></span>
                        </div>
                        <div class="file-actions">
                            <button type="button" class="btn-remove-file" id="remove-${uploaderId}" title="${[[#{add_question.image_upload.remove_title}]]}"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <input type="file" name="${inputName}" id="${uploaderId}" accept="image/*" class="hidden-file-input">
                `;

                const area = document.getElementById(`area-${uploaderId}`);
                const card = document.getElementById(`card-${uploaderId}`);
                const input = document.getElementById(uploaderId);
                const preview = document.getElementById(`preview-${uploaderId}`);
                const name = document.getElementById(`name-${uploaderId}`);
                const removeBtn = document.getElementById(`remove-${uploaderId}`);

                area.addEventListener('click', () => input.click());
                preview.addEventListener('click', () => openLightbox(preview.src));

                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            preview.src = event.target.result;
                            name.textContent = file.name;
                            area.style.display = 'none';
                            card.style.display = 'flex';
                            if (textInput) textInput.required = false;
                        };
                        reader.readAsDataURL(file);
                    }
                });

                removeBtn.addEventListener('click', () => {
                    input.value = '';
                    preview.src = '';
                    name.textContent = '';
                    area.style.display = 'flex';
                    card.style.display = 'none';
                    if (textInput) textInput.required = true;
                });
            }
        }
    }

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
</script>

</body>
</html>
