<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{results.title}"></title>
    <div th:replace="~{fragments :: common-styles}"></div>
    <style>
        body {
            background: #f7f4ef;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .results-wrapper {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }
        .results-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .results-header {
            background: white;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid #edf2f7;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .user-info img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #3498db;
        }
        .user-details {
            text-align: left;
        }
        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3748;
        }
        .user-email {
            font-size: 0.85rem;
            color: #718096;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #edf2f7;
            margin: 0 auto 1.5rem auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            transition: transform 0.3s ease;
        }
        .score-circle:hover {
            transform: scale(1.05);
        }
        .iq-score {
            font-size: 4rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1;
        }
        .score-label {
            font-size: 0.9rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .category-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        /* Color variants matching the system style */
        .category-genius { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .category-superior { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .category-high { background: #ecfdf5; color: #047857; border: 1px solid #d1fae5; }
        .category-average { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .category-below { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            background: #f8fafc;
        }
        .stat-item {
            text-align: center;
            padding: 1rem;
        }
        .stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            display: block;
        }
        .stat-lbl {
            font-size: 0.8rem;
            color: #718096;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .interpretation-section {
            padding: 2rem;
            border-top: 1px solid #edf2f7;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .interpretation-text {
            color: #4a5568;
            line-height: 1.7;
            font-size: 1rem;
            background: #f1f5f9;
            padding: 1.25rem;
            border-radius: 8px;
        }

        .action-area {
            padding: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            border-top: 1px solid #edf2f7;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }

        .btn-outline { border: 1px solid #cbd5e0; color: #4a5568; background: white; }
        .btn-outline:hover { background: #f7fafc; border-color: #a0aec0; }

        .btn-gold {
            background: #bfa76a;
            color: white;
            box-shadow: 0 4px 12px rgba(191, 167, 106, 0.3);
        }
        .btn-gold:hover { background: #a68f55; transform: translateY(-1px); }

        .accuracy-container {
            padding: 0 2rem 2rem 2rem;
        }
        .progress-track {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #3498db;
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            .results-wrapper { margin: 1rem auto; }
            .score-circle { width: 140px; height: 140px; }
            .iq-score { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments :: navbar(backLink=@{/dashboard})}"></div>

    <div class="results-wrapper">
        <div class="results-card">
            <!-- Header Section -->
            <div class="results-header">
                <div class="user-info" th:if="${userName}">
                    <img th:src="${profilePicture != null ? profilePicture : '/images/default-avatar.png'}" alt="Profil">
                    <div class="user-details">
                        <div class="user-name" th:text="${userName}"></div>
                        <div class="user-email" th:text="${userEmail}" th:if="${userEmail}"></div>
                    </div>
                </div>

                <div class="score-circle">
                    <div class="iq-score" th:text="${iqScore != null ? iqScore : 'N/A'}"></div>
                    <div class="score-label" th:text="#{results.iq_score.label}"></div>
                </div>

                <div th:if="${category}"
                     class="category-badge"
                     th:classappend="${iqScore >= 130} ? 'category-genius' :
                                    (${iqScore >= 120} ? 'category-superior' :
                                    (${iqScore >= 110} ? 'category-high' :
                                    (${iqScore >= 90} ? 'category-average' : 'category-below')))"
                     th:text="${category}"></div>

                <p style="color: #718096; margin: 0;" th:text="#{results.congratulations}"></p>
            </div>

            <!-- Stats Bar -->
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-val" th:text="${correctAnswers != null ? correctAnswers : 0}"></span>
                    <span class="stat-lbl" th:text="#{results.stat.correct}"></span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" th:text="${totalQuestions != null ? totalQuestions : 0}"></span>
                    <span class="stat-lbl" th:text="#{results.stat.total}"></span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" th:text="${testSession.timeTakenSeconds != null ? (testSession.timeTakenSeconds / 60) + ':' + #numbers.formatInteger(testSession.timeTakenSeconds % 60, 2) : 'N/A'}"></span>
                    <span class="stat-lbl" th:text="#{results.stat.time}"></span>
                </div>
            </div>

            <!-- Accuracy -->
            <div class="accuracy-container" th:if="${accuracy != null}">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: #4a5568;">
                    <span th:text="#{results.accuracy.label}"></span>
                    <span th:text="${accuracy} + '%'"></span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" th:style="'width: ' + ${accuracy} + '%'"></div>
                </div>
            </div>

            <!-- Interpretation -->
            <div class="interpretation-section" th:if="${interpretation}">
                <div class="section-title">
                    <i class="fas fa-chart-line" style="color: #3498db;"></i>
                    <span th:text="#{results.interpretation.title}"></span>
                </div>
                <div class="interpretation-text" th:text="${interpretation}">
                </div>
            </div>

            <!-- Actions -->
            <div class="action-area">
                <div th:if="${certificateEnabled}">
                    <a th:href="@{/certificate/claim/{sessionId}(sessionId=${testSession.sessionId})}" class="btn btn-gold">
                        <i class="fas fa-certificate"></i> <span th:text="#{results.claim_certificate}"></span>
                    </a>
                </div>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="fas fa-th-large"></i> <span th:text="#{results.dashboard_button}"></span>
                </a>
                <a th:href="@{/test/select-quiz}" class="btn btn-outline">
                    <i class="fas fa-redo"></i> <span th:text="#{results.retake_button}"></span>
                </a>
                <a th:href="@{/test/history}" class="btn btn-outline">
                    <i class="fas fa-history"></i> <span th:text="#{results.history_button}"></span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
