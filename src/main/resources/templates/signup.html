<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Account - IQ Assessment Platform</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
        }
        .signup-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
        }
        .signup-header {
            background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            color: white;
        }
        .signup-header h2 {
            color: white;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .signup-header h2 img {
            height: 32px;
            width: auto;
        }
        .signup-header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.95rem;
        }
        .signup-body {
            padding: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #2C3E50;
            font-size: 0.9rem;
        }
        .required {
            color: #E74C3C;
        }
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #BDC3C7;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498DB;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        .validation-message {
            font-size: 0.85rem;
            margin-top: 0.4rem;
            display: none;
        }
        .validation-message.show {
            display: block;
        }
        .error {
            color: #E74C3C;
        }
        .success {
            color: #27AE60;
        }
        .btn-submit {
            width: 100%;
            background: #3498DB;
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover:not(:disabled) {
            background: #2980B9;
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E5E7EB;
            color: #7F8C8D;
            font-size: 0.95rem;
        }
        .login-link a {
            color: #3498DB;
            text-decoration: none;
            font-weight: 500;
        }
        .alert-error {
            background: #FADBD8;
            color: #E74C3C;
            border: 1px solid #F5B7B1;
            padding: 0.875rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="signup-container">
    <div class="signup-header">
        <h2>
            <img th:src="@{/images/icon.png}" alt="Logo">
            Create Your Account
        </h2>
        <p>Join the professional cognitive assessment platform</p>
    </div>

    <div class="signup-body">
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/signup}" th:object="${signupRequest}" method="post" id="signupForm">
            <div class="form-group">
                <label for="username">Username <span class="required">*</span></label>
                <input type="text" id="username" th:field="*{username}" required
                       placeholder="Choose a unique username" minlength="3" maxlength="50">
                <div class="validation-message error" id="usernameError"></div>
                <div class="validation-message success" id="usernameSuccess"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" th:field="*{email}" required
                       placeholder="your.email@example.com">
                <div class="validation-message error" id="emailError"></div>
                <div class="validation-message success" id="emailSuccess"></div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" th:field="*{password}" required
                       placeholder="Minimum 6 characters" minlength="6">
                <div class="validation-message error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                       placeholder="Re-enter your password">
                <div class="validation-message error" id="confirmPasswordError"></div>
                <div class="validation-message success" id="confirmPasswordSuccess"></div>
            </div>

            <div class="form-group">
                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" th:field="*{age}" min="10" max="120" required
                       placeholder="Your age">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" th:field="*{country}">
                    <option value="">Select your country (optional)</option>
                    <option value="USA">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="India">India</option>
                    <option value="China">China</option>
                    <option value="Japan">Japan</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Uzbekistan">Uzbekistan</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a th:href="@{/login}">Sign in here</a>
        </div>
    </div>
</div>

<script>
    let usernameAvailable = false;
    let emailAvailable = false;
    let passwordsMatch = false;

    document.getElementById('username').addEventListener('blur', async function() {
        const username = this.value;
        if (username.length < 3) {
            showError('username', 'Username must be at least 3 characters');
            usernameAvailable = false;
            return;
        }

        try {
            const response = await fetch(`/check-username?username=${encodeURIComponent(username)}`);
            const data = await response.json();

            if (data.available) {
                showSuccess('username', 'Username is available');
                usernameAvailable = true;
            } else {
                showError('username', 'Username is already taken');
                usernameAvailable = false;
            }
        } catch (error) {
            console.error('Error checking username:', error);
        }
        updateSubmitButton();
    });

    document.getElementById('email').addEventListener('blur', async function() {
        const email = this.value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
            showError('email', 'Please enter a valid email address');
            emailAvailable = false;
            return;
        }

        try {
            const response = await fetch(`/check-email?email=${encodeURIComponent(email)}`);
            const data = await response.json();

            if (data.available) {
                showSuccess('email', 'Email is available');
                emailAvailable = true;
            } else {
                showError('email', 'Email is already registered');
                emailAvailable = false;
            }
        } catch (error) {
            console.error('Error checking email:', error);
        }
        updateSubmitButton();
    });

    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        if (password.length < 6) {
            showError('password', 'Password must be at least 6 characters');
        } else {
            hideError('password');
            checkPasswordMatch();
        }
    });

    document.getElementById('confirmPassword').addEventListener('input', function() {
        checkPasswordMatch();
    });

    function checkPasswordMatch() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (confirmPassword === '') {
            hideError('confirmPassword');
            hideSuccess('confirmPassword');
            passwordsMatch = false;
            updateSubmitButton();
            return;
        }

        if (password === confirmPassword && password.length >= 6) {
            showSuccess('confirmPassword', 'Passwords match');
            passwordsMatch = true;
        } else {
            showError('confirmPassword', 'Passwords do not match');
            passwordsMatch = false;
        }
        updateSubmitButton();
    }

    function showError(field, message) {
        document.getElementById(field + 'Error').textContent = message;
        document.getElementById(field + 'Error').classList.add('show');
        if (document.getElementById(field + 'Success')) {
            document.getElementById(field + 'Success').classList.remove('show');
        }
    }

    function showSuccess(field, message) {
        if (document.getElementById(field + 'Success')) {
            document.getElementById(field + 'Success').textContent = message;
            document.getElementById(field + 'Success').classList.add('show');
        }
        document.getElementById(field + 'Error').classList.remove('show');
    }

    function hideError(field) {
        document.getElementById(field + 'Error').classList.remove('show');
    }

    function hideSuccess(field) {
        if (document.getElementById(field + 'Success')) {
            document.getElementById(field + 'Success').classList.remove('show');
        }
    }

    function updateSubmitButton() {
        const submitBtn = document.getElementById('submitBtn');
        if (usernameAvailable && emailAvailable && passwordsMatch) {
            submitBtn.disabled = false;
        } else {
            submitBtn.disabled = true;
        }
    }

    updateSubmitButton();
</script>
</body>
</html>
