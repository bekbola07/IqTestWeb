<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{about.title}"></title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 1.5rem;
        }
        p {
            line-height: 1.8;
            color: #555;
            margin-bottom: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="#{about.header}"></h1>
    <p th:text="#{about.description1}"></p>

    <h2 th:text="#{about.how_works.title}"></h2>
    <p th:text="#{about.how_works.description}"></p>

    <h2 th:text="#{about.scoring.title}"></h2>
    <ul>
        <li th:text="#{about.score130}"></li>
        <li th:text="#{about.score120}"></li>
        <li th:text="#{about.score110}"></li>
        <li th:text="#{about.score90}"></li>
        <li th:text="#{about.score_below90}"></li>
    </ul>

    <a th:href="@{/}" class="btn" th:text="#{about.back_home}"></a>
</div>
</body>
</html>
