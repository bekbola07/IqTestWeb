<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assessment - IQ Platform</title>
    <div th:replace="~{fragments :: common-styles}"></div>
    <style>
        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            padding-top: 70px;
            min-height: 100vh;
        }

        /* Header - Professional & Balanced */
        .assessment-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0.75rem 2rem;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .user-badge img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }
        .timer {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--danger-color);
            background-color: #fdecea;
            padding: 0.4rem 1rem;
            border-radius: 8px;
        }

        /* Progress Bar */
        .progress-container {
            max-width: 900px;
            margin: 1rem auto;
            padding: 0 1.5rem;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .progress-bar {
            width: 100%;
            height: 7px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.4s ease;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
        }
        .question-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .question-number {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }
        .question-text {
            font-size: 1.35rem;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .question-image {
            max-width: 100%;
            max-height: 35vh; /* Balanced height for visibility without pushing content too far */
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Option Cards - Balanced & Clickable */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.85rem;
        }
        @media (min-width: 768px) {
            .options-grid {
                /* Intelligent layout: stacks horizontally if space permits */
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            }
        }

        .option-card {
            position: relative;
            background: #f9fafb;
            padding: 1rem 1.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .option-card:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }
        .option-card.selected {
            border-color: var(--primary-color);
            background: #f0f9ff;
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.1);
        }
        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* Radio Icon - Standard 20px */
        .radio-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 50%;
            background: white;
            position: relative;
        }
        .option-card.selected .radio-icon {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
        }
        .radio-icon::after {
            content: '';
            position: absolute;
            display: none;
            left: 5px;
            top: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }
        .option-card.selected .radio-icon::after {
            display: block;
        }

        .option-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .option-text {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 400;
        }
        .option-image {
            max-width: 100px;
            max-height: 60px;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Action Buttons */
        .actions-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
        }
        .btn-next {
            background: var(--primary-color);
            color: white;
            padding: 0.85rem 2.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .btn-next:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Lightbox */
        .lightbox { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

        @media (max-width: 768px) {
            .container { padding: 0 1rem 1.5rem; }
            .question-card { padding: 1.5rem; }
            .question-text { font-size: 1.25rem; }
            .btn-next { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Fixed Header -->
<header class="assessment-header">
    <div class="user-badge">
        <img th:src="${profilePicture}" alt="User" th:if="${profilePicture}">
        <span style="font-weight: 500;" th:text="${userName}">User</span>
    </div>
    <div id="timer" class="timer" th:if="${timeLimitSeconds != null}">00:00</div>
</header>

<div class="progress-container">
    <div class="progress-info">
        <span>Question <span th:text="${currentIndex + 1}">1</span> of <span th:text="${totalQuestions}">20</span></span>
        <span><span th:text="${progress}">5</span>% Complete</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" th:style="'width: ' + ${progress} + '%'"></div>
    </div>
</div>

<div class="container">
    <form id="questionForm" th:action="@{/test/submit-answer}" method="post">
        <!-- Hidden fields -->
        <input type="hidden" name="questionSnapshotId" th:value="${questionSnapshot.snapshotId}">
        <input type="hidden" name="nextIndex" th:value="${currentIndex + 1}">
        <input type="hidden" id="timeTakenSeconds" name="timeTakenSeconds" value="0">

        <div class="question-card">
            <div class="question-number">Question <span th:text="${currentIndex + 1}">1</span></div>

            <div th:if="${questionSnapshot.questionText != null and !questionSnapshot.questionText.isEmpty()}"
                 class="question-text" th:text="${questionSnapshot.questionText}"></div>

            <img th:if="${questionSnapshot.attachment != null}"
                 th:src="@{${questionSnapshot.attachment.webUrl != null ? questionSnapshot.attachment.webUrl : '/attachment/' + questionSnapshot.attachment.id}}"
                 class="question-image"
                 alt="Question visual"
                 onclick="openLightbox(this.src)">

            <div class="options-grid">
                <label th:each="option : ${optionSnapshots}" class="option-card">
                    <input type="radio"
                           name="optionSnapshotId"
                           th:value="${option.snapshotId}"
                           required>
                    <div class="radio-icon"></div>
                    <div class="option-content">
                        <span th:if="${option.optionText != null and !option.optionText.isEmpty()}"
                              class="option-text" th:text="${option.optionText}"></span>
                        <img th:if="${option.attachment != null}"
                             th:src="@{${option.attachment.webUrl != null ? option.attachment.webUrl : '/attachment/' + option.attachment.id}}"
                             class="option-image"
                             alt="Option visual"
                             onclick="event.preventDefault(); openLightbox(this.src)">
                    </div>
                </label>
            </div>

            <div class="actions-footer">
                <button type="submit" id="submitBtn" class="btn-next"
                        th:text="${currentIndex + 1 < totalQuestions} ? 'Next Question →' : 'Finish Assessment'"
                        disabled>
                </button>
            </div>
        </div>
    </form>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="">
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const timeLimitSeconds = /*[[${timeLimitSeconds}]]*/ null;
    let timeLeft = timeLimitSeconds;
    let timeTaken = 0;
    const timerElement = document.getElementById('timer');
    const timeTakenInput = document.getElementById('timeTakenSeconds');
    const form = document.getElementById('questionForm');
    const submitBtn = document.getElementById('submitBtn');

    // --- Timer Logic ---
    if (timeLimitSeconds != null) {
        const updateTimer = () => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerElement.textContent = "00:00";
                const radios = form.querySelectorAll('input[type="radio"]');
                radios.forEach(radio => radio.removeAttribute('required'));
                form.submit();
            } else {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;
            }
        };
        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    }

    // --- Time Taken Tracker ---
    setInterval(() => {
        timeTaken++;
        timeTakenInput.value = timeTaken;
    }, 1000);

    // --- Clickable Card Logic ---
    const optionCards = document.querySelectorAll('.option-card');
    optionCards.forEach(card => {
        card.addEventListener('click', () => {
            optionCards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            card.querySelector('input[type="radio"]').checked = true;
            submitBtn.disabled = false;
        });
    });

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeLightbox();
        }
    });
    /*]]>*/
</script>

</body>
</html>
